apiVersion: v1
kind: Secret
metadata:
  name: target-cluster-credentials
  namespace: openshift-mtv
type: Opaque
stringData:
  token: replace-me
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    replace-me
    -----END CERTIFICATE-----
---
apiVersion: validation.kubevirt.io/v1alpha1
kind: VirtualizationValidation
metadata:
  name: target-canary
  namespace: openshift-mtv
spec:
  target:
    url: https://api.target.example.com:6443
    credentialsSecret:
      name: target-cluster-credentials
      tokenKey: token
      caKey: ca.crt
    identity:
      id: target-cluster-uuid
      displayName: target-cnv
  workload:
    namespace: mtv-validation
    dataSource:
      apiGroup: cdi.kubevirt.io
      kind: DataSource
      namespace: openshift-virtualization-os-images
      name: rhel10
  run:
    id: initial
    profile: basic-v1
    suiteTimeoutSeconds: 900
    executionTimeoutSeconds: 300
    queueTimeoutSeconds: 900
